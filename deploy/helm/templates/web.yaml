apiVersion: apps/v1
kind: Deployment
metadata:
  name: xian-web
  labels:
    {{- include "xian.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.web }}
  selector:
    matchLabels:
      app: xian-web
  template:
    metadata:
      labels:
        app: xian-web
    spec:
      containers:
        - name: web
          image: {{ include "xian.web.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet: { path: /, port: 80 }
          readinessProbe:
            httpGet: { path: /, port: 80 }
---
apiVersion: v1
kind: Service
metadata:
  name: xian-web
spec:
  selector:
    app: xian-web
  ports:
    - port: 80
      targetPort: 80