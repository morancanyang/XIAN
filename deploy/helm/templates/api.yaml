apiVersion: apps/v1
kind: Deployment
metadata:
  name: xian-api
  labels:
    {{- include "xian.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels:
      app: xian-api
  template:
    metadata:
      labels:
        app: xian-api
        {{- include "xian.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: {{ include "xian.api.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            {{- include "xian.env.common" . | nindent 12 }}
            - name: XIAN_CORS_ORIGINS
              value: "https://{{ .Values.ingress.host }}"
          readinessProbe:
            httpGet: { path: /readyz, port: {{ .Values.api.port }} }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.api.port }} }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: xian-api
spec:
  selector:
    app: xian-api
  ports:
    - port: 80
      targetPort: {{ .Values.api.port }}