# 默认值：开发/预发可直接用；生产请覆盖 secrets 与镜像仓库。
image:
  registry: registry.example.com
  tag: "1.0.0"
  pullPolicy: IfNotPresent

replicaCount:
  api: 2
  worker: 3
  beat: 1
  web: 1

env: prod

api:
  port: 8000
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

worker:
  concurrency: 4
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpus: "2", memory: 2Gi }

secrets:
  postgresPassword: change-me
  redisPassword: change-me
  minioPassword: change-me
  grafanaPassword: change-me

dependencies:
  postgres:
    enabled: true
    image: postgres:16-alpine
    storage: 20Gi
  redis:
    enabled: true
    image: redis:7-alpine
  clickhouse:
    enabled: true
    image: clickhouse/clickhouse-server:24-alpine
    storage: 50Gi
  qdrant:
    enabled: true
    image: qdrant/qdrant:v1.12.1
    storage: 20Gi
  minio:
    enabled: true
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    storage: 50Gi

ingress:
  enabled: true
  host: xian.example.com
  tlsSecret: xian-tls

observability:
  prometheus: true
  grafana: true
  loki: true

sandbox:
  runtimeClass: gvisord
  nodeSelector:
    xian.io/sandbox-pool: "true"