# 开发态编排（技术方案 4.2）。
# 用法：
#   docker compose -f deploy/docker/compose.dev.yml --profile data up -d   # 起数据面
#   docker compose -f deploy/docker/compose.dev.yml up -d                    # 起应用面
name: xian-dev

services:
  api:
    build:
      context: ../..
      dockerfile: backend/services/api/Dockerfile
    environment:
      XIAN_ENV: dev
      XIAN_DB_DSN: postgresql+asyncpg://xian:xian@postgres:5432/xian
      XIAN_REDIS_URL: redis://redis:6379/0
      XIAN_CLICKHOUSE_DSN: clickhouse://default:@clickhouse:8123/xian
      XIAN_QDRANT_URL: http://qdrant:6333
      XIAN_S3_ENDPOINT: http://minio:9000
      XIAN_CELERY_BROKER_URL: redis://redis:6379/1
      XIAN_CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    profiles: ["app"]

  worker:
    build:
      context: ../..
      dockerfile: backend/services/worker/Dockerfile
    environment:
      XIAN_ENV: dev
      XIAN_DB_DSN: postgresql+asyncpg://xian:xian@postgres:5432/xian
      XIAN_REDIS_URL: redis://redis:6379/0
      XIAN_CELERY_BROKER_URL: redis://redis:6379/1
      XIAN_CLICKHOUSE_DSN: clickhouse://default:@clickhouse:8123/xian
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    profiles: ["app"]

  beat:
    build:
      context: ../..
      dockerfile: backend/services/worker/Dockerfile
    command: ["celery", "-A", "xian_worker.celery_app", "beat", "-l", "info"]
    environment:
      XIAN_CELERY_BROKER_URL: redis://redis:6379/1
      XIAN_DB_DSN: postgresql+asyncpg://xian:xian@postgres:5432/xian
    depends_on:
      redis:
        condition: service_started
    profiles: ["app"]

  web:
    build:
      context: ../..
      dockerfile: frontend/apps/web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started
    profiles: ["app"]

  egress-proxy:
    build:
      context: ../sandbox-runtime/egress-proxy
      dockerfile: Dockerfile
    ports:
      - "8899:8899"
    environment:
      EGRESS_ALLOWLIST: api.openai.com,api.anthropic.com,registry.npmjs.org,pypi.org
    profiles: ["app"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xian
      POSTGRES_PASSWORD: xian
      POSTGRES_DB: xian
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xian -d xian"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ["data"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    profiles: ["data"]

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    environment:
      CLICKHOUSE_DB: xian
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse
    profiles: ["data"]

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    profiles: ["data"]

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: xian
      MINIO_ROOT_PASSWORD: xian-dev-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    profiles: ["data"]

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    volumes:
      - ./../../../backend/libs/xian_core/src/xian_core/llm/litellm.config.yaml:/app/config.yaml:ro
    profiles: ["data"]

volumes:
  pgdata:
  redisdata:
  chdata:
  qdrantdata:
  miniodata: