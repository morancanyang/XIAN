# 生产态编排（技术方案 4.2 / 12.3）：数据面常驻 + 应用面水平扩副本。
name: xian

services:
  api:
    image: ${XIAN_IMAGE_API:-registry.example.com/xian/api}:${XIAN_VERSION:-1.0.0}
    environment:
      XIAN_ENV: prod
      XIAN_DB_DSN: postgresql+asyncpg://xian:${POSTGRES_PASSWORD}@postgres:5432/xian
      XIAN_REDIS_URL: redis://redis:6379/0
      XIAN_CLICKHOUSE_DSN: clickhouse://default:${CLICKHOUSE_PASSWORD}@clickhouse:8123/xian
      XIAN_QDRANT_URL: http://qdrant:6333
      XIAN_S3_ENDPOINT: http://minio:9000
      XIAN_CELERY_BROKER_URL: redis://redis:6379/1
      XIAN_CORS_ORIGINS: ${XIAN_CORS_ORIGINS:-https://xian.example.com}
    depends_on:
      - postgres
      - redis
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 1G }
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"

  worker:
    image: ${XIAN_IMAGE_WORKER:-registry.example.com/xian/worker}:${XIAN_VERSION:-1.0.0}
    environment:
      XIAN_ENV: prod
      XIAN_DB_DSN: postgresql+asyncpg://xian:${POSTGRES_PASSWORD}@postgres:5432/xian
      XIAN_REDIS_URL: redis://redis:6379/0
      XIAN_CELERY_BROKER_URL: redis://redis:6379/1
      XIAN_CLICKHOUSE_DSN: clickhouse://default:${CLICKHOUSE_PASSWORD}@clickhouse:8123/xian
    deploy:
      replicas: 3
      resources:
        limits: { cpus: "2.0", memory: 2G }

  beat:
    image: ${XIAN_IMAGE_WORKER:-registry.example.com/xian/worker}:${XIAN_VERSION:-1.0.0}
    command: ["celery", "-A", "xian_worker.celery_app", "beat", "-l", "info"]
    environment:
      XIAN_CELERY_BROKER_URL: redis://redis:6379/1
    deploy:
      replicas: 1

  web:
    image: ${XIAN_IMAGE_WEB:-registry.example.com/xian/web}:${XIAN_VERSION:-1.0.0}
    ports:
      - "8080:80"
    depends_on:
      - api

  sandbox-runtime:
    image: ${XIAN_IMAGE_SANDBOX:-registry.example.com/xian/sandbox-runtime}:${XIAN_VERSION:-1.0.0}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    profiles: ["sandbox"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: xian
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 4G }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    environment:
      CLICKHOUSE_DB: xian
    volumes:
      - chdata:/var/lib/clickhouse

  qdrant:
    image: qdrant/qdrant:v1.12.1
    volumes:
      - qdrantdata:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: xian
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - miniodata:/data

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana

  loki:
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

volumes:
  pgdata:
  redisdata:
  chdata:
  qdrantdata:
  miniodata:
  grafanadata: