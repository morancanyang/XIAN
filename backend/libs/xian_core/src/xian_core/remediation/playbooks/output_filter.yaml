id: RB-OUTPUT-A
title: 输出侧 PII/密钥过滤与编码解码检测
root_cause: output_no_filter
artifacts:
  - type: code
    language: python
    snippet: |
      import base64, codecs, re

      SECRET_RE = re.compile(r"sk-canary-[A-Za-z0-9\\-]{4,64}")
      PHONE_RE = re.compile(r"(?<!\\d)1[3-9]\\d{9}(?!\\d)")

      def decodes_to_secret(text: str) -> bool:
          candidates = [text]
          for fn in (lambda s: base64.b64decode(s + "=" * (-len(s) % 4)).decode("utf-8", "ignore"),
                     lambda s: bytes.fromhex(s).decode("utf-8", "ignore"),
                     lambda s: codecs.decode(s, "rot_13")):
              try:
                  candidates.append(fn(text))
              except Exception:
                  pass
          return any(SECRET_RE.search(c) for c in candidates)

      def output_filter(text: str) -> str:
          if SECRET_RE.search(text) or decodes_to_secret(text):
              raise OutputBlocked("输出包含敏感凭据，已拦截")
          return PHONE_RE.sub("[REDACTED]", text)
