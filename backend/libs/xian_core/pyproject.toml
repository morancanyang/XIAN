[project]
name = "xian-core"
version = "1.0.0"
description = "XIAN 领域逻辑共享库：唯一领域能力归属地（api/worker/cli 共同依赖）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "celery>=5.4",
    "redis>=5.1",
    "clickhouse-connect>=0.8",
    "qdrant-client>=1.12",
    "minio>=7.2",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "dnspython>=2.7",
    "litellm>=1.48",
    "tenacity>=9.0",
    "orjson>=3.10",
    "python-multipart>=0.0.12",
    "cryptography>=43.0",
    "typer>=0.12",
    "rich>=13.9",
]

[project.optional-dependencies]
pdf = ["playwright>=1.48"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.10",
    "mypy>=1.11",
    "testcontainers[postgres,redis,clickhouse]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xian_core"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"