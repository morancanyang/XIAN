[project]
name = "xian-api"
version = "1.0.0"
description = "XIAN FastAPI 控制平面服务（协议适配与调度，不写业务逻辑）"
requires-python = ">=3.12"
dependencies = [
    "xian-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0.36",
    "celery>=5.4",
    "redis>=5.1",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xian_api"]

[tool.uv.sources]
xian-core = { workspace = true }
[tool.pytest.ini_options]
pythonpath = ["src", "../worker", "../cli", "../../libs/xian_core/src"]
asyncio_mode = "auto"
