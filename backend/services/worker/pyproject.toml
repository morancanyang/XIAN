[project]
name = "xian-worker"
version = "1.0.0"
description = "XIAN Celery 执行平面（战役 / 复测 / 报告渲染 / 巡检 / 关卡 / 通知）"
requires-python = ">=3.12"
dependencies = [
    "xian-core",
    "celery>=5.4",
    "redis>=5.1",
    "sqlalchemy>=2.0.36",
    "httpx>=0.27",
    "litellm>=1.48",
    "clickhouse-connect>=0.8",
    "qdrant-client>=1.12",
    "minio>=7.2",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "testcontainers>=4.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xian_worker"]

[tool.uv.sources]
xian-core = { workspace = true }
[tool.pytest.ini_options]
pythonpath = ["src", "../api", "../cli", "../../libs/xian_core/src"]
asyncio_mode = "auto"
