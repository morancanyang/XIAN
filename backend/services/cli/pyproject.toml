[project]
name = "xian-cli"
version = "1.0.0"
description = "XIAN CLI：xian scan（CI/CD 回归门禁）"
requires-python = ">=3.12"
dependencies = [
    "xian-core",
    "typer>=0.12",
    "rich>=13.9",
    "httpx>=0.27",
]

[project.scripts]
xian = "xian_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xian_cli"]

[tool.uv.sources]
xian-core = { workspace = true }
[tool.pytest.ini_options]
pythonpath = ["src", "../api", "../worker", "../../libs/xian_core/src"]
asyncio_mode = "auto"
